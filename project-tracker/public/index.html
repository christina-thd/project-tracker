<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Project Tracker</title>
  <link rel="icon" href="img/logo.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <meta name="theme-color" content="#0b0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Projects">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/tracker.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <!-- ===== home: who's using it (each person has their own projects) ===== -->
    <div class="view home-view" id="homeView" hidden>
      <img class="home-logo" src="img/logo.svg" alt="" width="56" height="56">
      <h1>Who's this?</h1>
      <p class="home-tagline" id="homeTagline"></p>
      <div class="people" id="people"></div>
      <button type="button" class="pill ghost" id="addPerson"></button>
    </div>

    <!-- ===== one person's projects ===== -->
    <div class="view" id="trackerView" hidden>
      <header class="top">
        <!-- the project you're on: tap to switch (js/tracker/switcher.js) -->
        <h1 class="project-title"><span id="appName">Projects</span><button type="button" class="project-button" id="projectButton" aria-haspopup="dialog" hidden></button></h1>
        <a class="repo-link" id="repoLink" target="_blank" rel="noopener noreferrer" hidden></a>
        <span class="offline-badge" id="offline" title="Not connected to Home Assistant: changes from other screens show up once it's back"></span>
        <p class="top-summary" id="summary"></p>
        <!-- whose projects these are: tap to go back to the home screen and switch person -->
        <button type="button" class="person-button" id="personButton"></button>
      </header>

      <!-- ===== phones: one status at a time; wide screens show all three columns ===== -->
      <div class="segmented status-tabs" id="statusTabs" role="tablist">
        <button type="button" role="tab" data-status="todo">Todo <span class="count"></span></button>
        <button type="button" role="tab" data-status="test">Test <span class="count"></span></button>
        <button type="button" role="tab" data-status="done">Done <span class="count"></span></button>
      </div>

      <main class="board" id="board">
        <section class="column" data-status="todo">
          <h2 class="column-head"><span class="column-label"><span class="column-dot"></span>Todo <span class="count"></span></span></h2>
          <ul class="list"></ul>
          <p class="empty"></p>
        </section>
        <section class="column" data-status="test">
          <h2 class="column-head"><span class="column-label"><span class="column-dot"></span>Test <span class="count"></span></span></h2>
          <ul class="list"></ul>
          <p class="empty"></p>
        </section>
        <section class="column" data-status="done">
          <h2 class="column-head">
            <span class="column-label"><span class="column-dot"></span>Done <span class="count"></span></span>
            <button type="button" class="clear-done" id="clearDone" hidden>Clear</button>
          </h2>
          <ul class="list"></ul>
          <p class="empty"></p>
        </section>
      </main>

      <!-- ===== first run: no projects yet ===== -->
      <section class="welcome" id="welcome" hidden>
        <img src="img/logo.svg" alt="" width="72" height="72">
        <h2>Track every project</h2>
        <p>Add a project, then jot down what's still to do and what's ready to test. It's on your phone and your PC at once.</p>
        <button type="button" class="pill primary" id="firstProject">Add your first project</button>
      </section>
    </div>
  </div>

  <button type="button" class="fab" id="addButton" aria-label="Add an item" hidden></button>

  <!-- ===== adding items: stays open after each one, for adding several in a row ===== -->
  <div class="layer" id="addLayer" hidden>
    <div class="backdrop" data-close></div>
    <section class="sheet add-sheet" role="dialog" aria-modal="true" aria-labelledby="addTitle">
      <div class="grabber" data-drag data-close></div>
      <div class="sheet-head" data-drag>
        <h2 class="sheet-title" id="addTitle"><span class="project-emoji" id="addEmoji"></span><span id="addProject"></span></h2>
        <button type="button" class="sheet-close" data-close>Close</button>
      </div>
      <form class="sheet-body" id="addForm" autocomplete="off">
        <div class="segmented" id="addStatus" role="radiogroup" aria-label="Add to">
          <button type="button" role="radio" data-status="todo">Todo</button>
          <button type="button" role="radio" data-status="test">Test</button>
        </div>
        <div class="add-row">
          <input type="text" class="text-input" id="addText" maxlength="300" enterkeyhint="send" spellcheck="true" aria-label="New item">
          <button type="submit" class="add-send" id="addSend" aria-label="Add"></button>
        </div>
        <p class="add-hint" id="addHint"></p>
      </form>
    </section>
  </div>

  <!-- ===== one item ===== -->
  <div class="layer" id="itemLayer" hidden>
    <div class="backdrop" data-close></div>
    <section class="sheet item-sheet" role="dialog" aria-modal="true" aria-label="Item">
      <div class="grabber" data-drag data-close></div>
      <div class="sheet-head" data-drag>
        <p class="item-project"><span class="project-emoji" id="itemProjectEmoji"></span><span id="itemProjectName"></span></p>
        <button type="button" class="sheet-close" data-close>Close</button>
      </div>
      <div class="sheet-body">
        <textarea class="item-text-input" id="itemText" rows="1" maxlength="300" aria-label="What"></textarea>
        <div class="segmented" id="itemStatus" role="radiogroup" aria-label="Status">
          <button type="button" role="radio" data-status="todo">Todo</button>
          <button type="button" role="radio" data-status="test">Test</button>
          <button type="button" role="radio" data-status="done">Done</button>
        </div>
        <textarea class="item-note-input" id="itemNote" rows="3" maxlength="2000"
          placeholder="Notes: how to test it, links, anything…" aria-label="Notes"></textarea>
        <p class="item-dates" id="itemDates"></p>
        <div class="item-actions">
          <button type="button" class="pill danger" id="itemDelete"></button>
          <button type="button" class="pill primary" id="itemSave"></button>
        </div>
      </div>
    </section>
  </div>

  <!-- ===== switching project: every project, most recently active first ===== -->
  <div class="layer" id="switchLayer" hidden>
    <div class="backdrop" data-close></div>
    <section class="sheet switch-sheet" role="dialog" aria-modal="true" aria-labelledby="switchTitle">
      <div class="grabber" data-drag data-close></div>
      <div class="sheet-head" data-drag>
        <h2 class="sheet-title" id="switchTitle">Projects</h2>
        <button type="button" class="sheet-close" data-close>Close</button>
      </div>
      <div class="switch-search" id="switchSearchRow" hidden>
        <input type="search" class="text-input" id="switchSearch" placeholder="Find a project" aria-label="Find a project" enterkeyhint="go">
      </div>
      <div class="switch-list" id="switchList" role="list"></div>
      <div class="switch-foot">
        <button type="button" class="pill ghost" id="switchNew"></button>
      </div>
    </section>
  </div>

  <!-- ===== a person: new, or rename / emoji / delete ===== -->
  <div class="layer" id="personLayer" hidden>
    <div class="backdrop" data-close></div>
    <section class="sheet person-sheet" role="dialog" aria-modal="true" aria-labelledby="personTitle">
      <div class="grabber" data-drag data-close></div>
      <div class="sheet-head" data-drag>
        <h2 class="sheet-title" id="personTitle"></h2>
        <button type="button" class="sheet-close" data-close>Close</button>
      </div>
      <form class="sheet-body" id="personForm" autocomplete="off">
        <div class="name-row">
          <span class="emoji-current" id="personEmoji" aria-hidden="true"></span>
          <input type="text" class="text-input" id="personName" maxlength="40" enterkeyhint="done" placeholder="Name" aria-label="Name">
        </div>
        <p class="settings-label">Emoji</p>
        <div class="emojis" id="personEmojis" role="radiogroup" aria-label="Emoji"></div>
        <label class="settings-label" for="personEmojiCustom">Not in the list?</label>
        <input type="text" class="text-input emoji-custom" id="personEmojiCustom" maxlength="16" autocomplete="off"
          placeholder="Use your emoji keyboard 😀">
        <button type="submit" class="pill primary" id="personSave"></button>
        <div class="project-extra" id="personExtra">
          <button type="button" class="pill danger" id="personDelete"></button>
        </div>
      </form>
    </section>
  </div>

  <!-- ===== a project: new, or rename / color / clear / delete ===== -->
  <div class="layer" id="projectLayer" hidden>
    <div class="backdrop" data-close></div>
    <section class="sheet project-sheet" role="dialog" aria-modal="true" aria-labelledby="projectTitle">
      <div class="grabber" data-drag data-close></div>
      <div class="sheet-head" data-drag>
        <h2 class="sheet-title" id="projectTitle"></h2>
        <button type="button" class="sheet-close" data-close>Close</button>
      </div>
      <form class="sheet-body" id="projectForm" autocomplete="off">
        <div class="name-row">
          <span class="emoji-current" id="projectEmoji" aria-hidden="true"></span>
          <input type="text" class="text-input" id="projectName" maxlength="40" enterkeyhint="done" placeholder="Project name" aria-label="Project name">
        </div>

        <p class="settings-label">Emoji</p>
        <div class="emojis" id="projectEmojis" role="radiogroup" aria-label="Emoji"></div>
        <label class="settings-label" for="projectEmojiCustom">Not in the list?</label>
        <input type="text" class="text-input emoji-custom" id="projectEmojiCustom" maxlength="16" autocomplete="off"
          placeholder="Use your emoji keyboard 😀">
        <p class="settings-label">Color</p>
        <div class="hues" id="projectHues" role="radiogroup" aria-label="Color"></div>
        <label class="settings-label" for="projectUrl">GitHub repo (optional)</label>
        <div class="repo-field">
          <span class="repo-prefix" aria-hidden="true">github.com/</span>
          <input type="text" id="projectUrl" maxlength="300" autocomplete="off" autocapitalize="off" spellcheck="false"
            enterkeyhint="done" placeholder="you/project">
          <a class="repo-open" id="projectUrlOpen" target="_blank" rel="noopener noreferrer" hidden>Open</a>
        </div>
        <button type="submit" class="pill primary" id="projectSave"></button>
        <div class="project-extra" id="projectExtra">
          <button type="button" class="pill ghost" id="projectClear"></button>
          <button type="button" class="pill danger" id="projectDelete"></button>
        </div>
      </form>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
