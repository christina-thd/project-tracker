name: "Project Tracker"
description: "What's still to do and what's ready to test, for every project you're working on"
version: "1.1.0"
slug: "project_tracker"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
ingress: true
ingress_port: 3200
# Optional direct address (http://<homeassistant-ip>:3200/), e.g. for "Add to Home Screen" on a phone
# or a browser tab on a PC. Not needed for the Home Assistant sidebar or app.
ports:
  3200/tcp: 3200
ports_description:
  3200/tcp: "Web interface (not needed for the Home Assistant sidebar)"
panel_icon: "mdi:clipboard-check-outline"
panel_title: "Projects"
